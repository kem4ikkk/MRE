<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Эскиз оформления чата MRE</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #111713; color: #edf1e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px clamp(12px, 4vw, 48px) 48px; }
    main { max-width: 1440px; margin: 0 auto; }
    header { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin: 0 0 18px; }
    h1 { font-size: clamp(20px, 3vw, 30px); margin:0; }
    p { margin:0; color:#aab5a9; font-size:14px; }
    figure { margin:0; border:1px solid #344139; border-radius:18px; overflow:hidden; background:#141b16; box-shadow:0 18px 50px #0006; }
    img { display:block; width:100%; height:auto; }
    figcaption { padding:12px 16px; color:#aab5a9; font-size:13px; border-top:1px solid #344139; }
    @media (max-width: 600px) { body { padding:16px 8px 28px; } figure { border-radius:10px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Предварительный эскиз чата MRE</h1>
      <p>Макет оформления и тематических иконок для согласования</p>
    </header>
    <figure>
      <img src="preview.svg" alt="Макет игрового чата с зелёной меткой MRE, красной меткой MRE-ADMIN, примерами сообщений и тематическими иконками: система, HOME, TPA, наборы, обмен, хранилище, голосование, аирдроп, модерация и админка.">
      <figcaption>Это концепт. Визуальное оформление и иконки в серверные плагины пока не установлены.</figcaption>
    </figure>
  </main>
</body>
</html>
