<!doctype html>

<head>

<title>MRE — предварительный просмотр меню</title>
<style>
@font-face{font-family:PT;src:url('../../MreHelp/Assets/MreFonts/PTSans-Regular.ttf')}@font-face{font-family:PT;src:url('../../MreHelp/Assets/MreFonts/PTSans-Bold.ttf');font-weight:700}
:root{color-scheme:dark;--ink:#edf4ef;--muted:#91a69a;--green:#75edb8;--edge:#30483d;--panel:#101c17;--line:#24382e}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:PT,'Segoe UI',sans-serif;color:var(--ink);background:#1c352b;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}.world{position:fixed;inset:0;background:linear-gradient(180deg,#708d96 0%,#9badad 48%,#5b7754 49%,#2a4a35 100%)}.world svg{width:100%;height:100%;display:block}.scrim{position:fixed;inset:0;background:rgba(3,12,9,.69)}.screen{position:relative;min-height:100vh;display:grid;place-items:center;padding:30px}.window{width:min(1190px,calc(100vw - 60px));height:min(740px,calc(100vh - 60px));min-height:570px;display:grid;grid-template-columns:238px minmax(0,1fr);background:#111d18;border:1px solid #3b5145;border-radius:14px;overflow:hidden;box-shadow:0 28px 80px #0009,0 2px 12px #0008}.sidebar{display:flex;flex-direction:column;padding:27px 16px 20px;background:#0c1712;border-right:1px solid #283a30}.brand{display:flex;align-items:center;gap:12px;margin:0 8px 35px}.brandmark{width:39px;height:39px;display:grid;place-items:center;background:#79eab4;color:#102219;font-size:19px;font-weight:700;border-radius:10px;letter-spacing:-1px}.brandtext strong{display:block;font-size:20px;line-height:1;letter-spacing:.07em}.brandtext span{display:block;margin-top:6px;color:#82978b;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.sidecaption{padding:0 12px;margin:0 0 10px;color:#71877b;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{position:relative;width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:12px 12px;display:flex;align-items:center;gap:12px;text-align:left;color:#a9bbb0;font-size:15px}.nav button:hover{background:#1b2e24;color:#fff}.nav button.active{background:#1b3528;color:#eafff1;border-color:#345947;font-weight:700}.nav button.active:before{content:'';position:absolute;left:-1px;top:9px;bottom:9px;width:3px;background:var(--green);border-radius:4px}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.sidebottom{margin-top:auto;border-top:1px solid #263a2f;padding:19px 12px 0;color:#8ba194;font-size:13px;line-height:1.4}.sidebottom strong{display:block;color:#c4d3c9;font-size:13px;margin-bottom:4px}.content{display:flex;min-width:0;min-height:0;flex-direction:column;background:#132019}.top{height:79px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #2a3b31}.topnav{display:flex;gap:6px;align-self:stretch}.topnav button{position:relative;border:0;background:transparent;padding:0 17px;color:#9aada1;font-size:15px;font-weight:700}.topnav button:hover{color:#edf8f0}.topnav button.active{color:#e9fff1}.topnav button.active:after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;height:3px;background:var(--green);border-radius:4px 4px 0 0}.topright{display:flex;align-items:center;gap:17px}.context{font-size:12px;color:#8da296;letter-spacing:.04em}.close{display:grid;place-items:center;width:36px;height:36px;background:#1c2c23;border:1px solid #3c5145;border-radius:8px;color:#c9d7cc;font-size:24px;line-height:1}.close:hover{background:#542d2b;color:#fff}.main{min-height:0;overflow:auto;padding:30px 38px 28px}.kicker{color:#77dca9;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin:0 0 10px}.heading{display:flex;align-items:start;justify-content:space-between;gap:18px;margin-bottom:22px}.heading h1{font-size:29px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}.heading p{font-size:15px;line-height:1.45;color:#a6b9ac;margin:0;max-width:650px}.pill{white-space:nowrap;border:1px solid #355b45;background:#183528;color:#a9e9c3;padding:7px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.05em}.welcome{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:21px 24px;margin-bottom:24px;border:1px solid #375944;border-radius:10px;background:linear-gradient(110deg,#203d2c,#172c21 75%)}.welcome h2{margin:0 0 6px;font-size:21px}.welcome p{margin:0;line-height:1.45;color:#afc4b5;font-size:14px}.welcome-mark{width:62px;height:62px;flex:none;border:1px solid #537c60;border-radius:16px;display:grid;place-items:center;color:#88ecb6;background:#224533}.welcome-mark .icon{width:29px;height:29px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-title h2{font-size:15px;letter-spacing:.02em;margin:0}.section-title span{color:#839b8b;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feature{display:flex;gap:14px;padding:17px 17px;min-height:92px;background:#192b21;border:1px solid #2d4235;border-radius:9px}.feature-icon{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:8px;background:#254435;color:#9de8bb}.feature-icon.gold{background:#443b25;color:#e6cb81}.feature h3{margin:0 0 4px;font-size:15px}.feature p{margin:0;color:#9fb3a5;font-size:13px;line-height:1.35}.feature code,.command code{font-family:inherit;color:#9beec0;font-weight:700}.hint{margin:18px 0 0;color:#90a799;font-size:13px}.command-list{border:1px solid #30463a;border-radius:9px;overflow:hidden}.command{display:grid;grid-template-columns:165px 1fr;gap:15px;align-items:center;min-height:45px;padding:10px 16px;background:#192b21;font-size:14px}.command+.command{border-top:1px solid #2d4135}.command span{color:#b3c2b7;line-height:1.35}.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:16px;color:#a7b9ad;font-size:13px}.pager button{width:34px;height:32px;border:1px solid #3a5243;background:#1b3023;border-radius:6px}.empty{min-height:255px;border:1px solid #30473a;border-radius:10px;background:#192b21;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px}.empty .feature-icon{margin:0 auto 16px}.empty h2{font-size:19px;margin:0 0 7px}.empty p{max-width:460px;line-height:1.5;color:#9fb3a5;font-size:14px;margin:0}.linkrow{padding:18px;border:1px solid #30473a;border-radius:9px;background:#192b21}.linkrow strong,.linkrow span{display:block}.linkrow span{margin-top:5px;color:#9fb3a5;font-size:13px;overflow-wrap:anywhere}.bottom{margin-top:auto;flex:none;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 38px;border-top:1px solid #2a3b31;color:#8fa397;font-size:13px}.key{padding:2px 7px;border:1px solid #405647;border-radius:4px;margin-right:6px;color:#c2d1c7}.reopen{display:none;position:fixed;top:24px;right:24px;border:1px solid #6fe3a7;background:#14261a;border-radius:8px;padding:10px 16px}.closed .window,.closed .scrim{display:none}.closed .reopen{display:block}@media(max-width:850px){.window{grid-template-columns:185px 1fr}.sidebar{padding-left:10px;padding-right:10px}.top{padding:0 15px}.topnav button{padding:0 8px}.main{padding:23px}.grid{grid-template-columns:1fr}.context{display:none}.bottom{padding:0 23px}}@media(max-height:650px){.window{height:calc(100vh - 30px);min-height:0}.screen{padding:15px}.main{padding-top:18px}.welcome{padding:14px;margin-bottom:14px}.feature{min-height:78px;padding:12px}.brand{margin-bottom:20px}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 4l9 7M5 10v9h14v-9M10 19v-5h4v5"/></symbol><symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19v-1a6 6 0 0 1 12 0v1M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v1"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="m4 7 3 3-3 3M10 16h5M3 4h18v16H3z"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-2 2M14 11a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l2-2"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 0v10l9 4 9-4V7M12 11v10"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h14m-3-3 3 3-3 3M20 16H6m3-3-3 3 3 3"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3 8 8 10 5-2 8-5 8-10V6l-8-3Z"/><path d="m8.5 12 2.5 2.5 5-5"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><path d="M3 9h18v4H3zM5 13v8h14v-8M12 9v12M12 9c-7 0-7-6-3-6 2 0 3 3 3 6Zm0 0c7 0 7-6 3-6-2 0-3 3-3 6Z"/></symbol><symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V12h4v8M10 20V5h4v15M16 20v-9h4v9M3 20h18"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.5 1.5m9.8 9.8 1.5 1.5m0-12.8-1.5 1.5m-9.8 9.8-1.5 1.5"/><circle cx="12" cy="12" r="7"/></symbol></svg>
<div class="world" aria-hidden="true"><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice"><path fill="#82999b" d="M0 0h1920v520H0z"/><path fill="#678165" d="M0 515 210 405l185 105 250-140 245 145 185-95 205 99 260-145 380 145v561H0z"/><path fill="#3d6447" d="M0 664 220 549l213 119 236-89 181 95 259-159 255 139 280-138 276 116v448H0z"/><path fill="#284f36" d="M0 785 285 656l198 113 283-85 200 94 231-94 297 94 243-102 183 84v320H0z"/><g fill="#254332"><path d="M185 675v-180h22v180zM138 535l58-146 60 146zm-20 55 78-157 79 157zM1540 660V420h24v240zM1480 472l72-180 72 180zm-24 66 96-200 96 200zM1735 735V510h20v225zm-62-180 72-175 72 175zm-16 57 88-185 89 185z"/></g></svg></div><div class="scrim"></div>
<div class="screen"><div class="window" role="region" aria-label="Меню MRE"><aside class="sidebar"><div class="brand"><div class="brandmark">M</div><div class="brandtext"><strong>MRE</strong><span>PEI · ВЫЖИВАНИЕ</span></div></div><p class="sidecaption">Навигация</p><nav class="nav" id="sideNav" aria-label="Разделы меню"></nav><div class="sidebottom"><strong>Сервер MRE</strong>Команды и информация<br>в одном месте</div></aside><section class="content"><header class="top"><nav class="topnav" aria-label="Основные вкладки"><button type="button" data-top="main" class="active">Основные</button><button type="button" data-top="progress">Прогресс</button><button type="button" data-top="settings">Настройки</button></nav><div class="topright"><span class="context">MRE / PEI</span><button type="button" class="close" aria-label="Закрыть меню">×</button></div></header><main class="main" id="content"></main><footer class="bottom"><span>Меню сервера MRE</span><span>Закрыть меню</span></footer></section></div></div><button class="reopen" type="button">Открыть меню MRE</button>
<script>
const icons={info:'i-info',group:'i-people',commands:'i-list',links:'i-link',rewards:'i-gift',top:'i-chart',settings:'i-gear'};const svg=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"></use></svg>`;const menu={main:[['info','Информация'],['commands','Команды'],['links','Ссылки'],['group','Группа']],progress:[['rewards','Награды'],['top','Топ игроков']],settings:[['settings','Настройки']]};const names={info:'Информация',commands:'Команды',links:'Ссылки',group:'Группа',rewards:'Награды',top:'Топ игроков',settings:'Настройки'};let topTab='main',section='info',page=1;const side=document.querySelector('#sideNav'),content=document.querySelector('#content');
const head=(k,title,desc,pill='MRE · PEI')=>`<p class="kicker">${k}</p><div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><span class="pill">${pill}</span></div>`;const feature=(icon,title,desc,gold=false)=>`<div class="feature"><span class="feature-icon ${gold?'gold':''}">${svg(icon)}</span><div><h3>${title}</h3><p>${desc}</p></div></div>`;const empty=(icon,title,desc)=>`<div class="empty"><div><span class="feature-icon">${svg(icon)}</span><h2>${title}</h2><p>${desc}</p></div></div>`;
const commands=[[['/menu','Открыть меню сервера.'],['/help','Открыть раздел команд.'],['/kits','Посмотреть доступные наборы.'],['/kit <имя>','Получить набор вещей.'],['/home','Переместиться к своей кровати.'],['/homes','Показать сохранённые кровати.'],['/tpa <игрок>','Отправить запрос на телепортацию.'],['/s','Открыть личное хранилище.']],[['/trade <игрок>','Предложить обмен предметами.'],['/vote day','Начать голосование за день.'],['/vote yes / no','Проголосовать.'],['/whenairdrop','Узнать время до следующего аирдропа.'],['/trustscore','Посмотреть свой trustscore.']]];
function render(){document.querySelectorAll('[data-top]').forEach(b=>{const active=b.dataset.top===topTab;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')});side.innerHTML=menu[topTab].map(([id,label])=>`<button type="button" data-section="${id}" class="${id===section?'active':''}" ${id===section?'aria-current="page"':''}>${svg(icons[id])}<span>${label}</span></button>`).join('');if(section==='info'){content.innerHTML=head('СЕРВЕР / ОБЗОР','Информация о сервере','Всё необходимое для начала игры и навигации по серверу.')+`<div class="welcome"><div><h2>Добро пожаловать на MRE</h2><p>Исследуйте PEI, стройте базу и играйте вместе с друзьями.</p></div><span class="welcome-mark">${svg('i-shield')}</span></div><div class="section-title"><h2>Основные возможности</h2><span>Быстрый обзор</span></div><div class="grid">${feature('i-box','Наборы вещей','<code>/kits</code> — доступные наборы и их получение.',true)}${feature('i-home','Дом','<code>/homes</code> — ваши кровати и точки дома.')}${feature('i-swap','Телепортация','<code>/tpa</code> — запрос на перенос к игроку.')}${feature('i-shield','Хранилище и обмен','<code>/s</code> и <code>/trade</code> — хранение и обмен.')}</div><p class="hint">Все доступные команды находятся в разделе «Команды».</p>`}else if(section==='commands'){content.innerHTML=head('СЕРВЕР / КОМАНДЫ','Команды сервера','Список основных команд, доступных игроку.',`СТРАНИЦА ${page} / 2`)+`<div class="command-list">${commands[page-1].map(([cmd,desc])=>`<div class="command"><code>${cmd.replaceAll('<','&lt;').replaceAll('>','&gt;')}</code><span>${desc}</span></div>`).join('')}</div><div class="pager"><button type="button" data-page="prev" aria-label="Предыдущая страница">‹</button><span>${page} / 2</span><button type="button" data-page="next" aria-label="Следующая страница">›</button></div>`}else if(section==='links'){content.innerHTML=head('СЕРВЕР / ССЫЛКИ','Ресурсы MRE','Ссылки на материалы проекта.')+`<div class="linkrow"><strong>Репозиторий MRE</strong><span>github.com/kem4ikkk/MRE</span></div><p class="hint">Адреса сообществ будут добавлены, когда они появятся.</p>`}else{let data={group:['i-people','Управление группой','Управление группой появится здесь после подключения. Сейчас используйте встроенное меню Unturned.'],rewards:['i-gift','Ежедневные награды','Раздел наград находится в разработке.'],top:['i-chart','Топ игроков','Рейтинг появится после подключения статистики сервера.'],settings:['i-gear','Настройки','Настройки интерфейса и игры появятся в этом разделе.']}[section];content.innerHTML=head('СЕРВЕР / '+names[section].toUpperCase(),names[section],'Информация об этом разделе.','СКОРО')+empty(...data)}content.scrollTop=0}
document.addEventListener('click',e=>{const t=e.target.closest('[data-top]');if(t){topTab=t.dataset.top;section=menu[topTab][0][0];page=1;render();return}const s=e.target.closest('[data-section]');if(s){section=s.dataset.section;page=1;render();return}const p=e.target.closest('[data-page]');if(p){page=p.dataset.page==='next'?Math.min(2,page+1):Math.max(1,page-1);render();return}if(e.target.closest('.close'))document.body.classList.add('closed');if(e.target.closest('.reopen'))document.body.classList.remove('closed')});render();
</script>
