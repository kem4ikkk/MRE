<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRE — макет меню</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="world" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
  <symbol id="icon-home" viewBox="0 0 24 24">
    <path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9M9 21v-7h6v7"/>
  </symbol>
  <symbol id="icon-help" viewBox="0 0 24 24"><path d="M12 5v16M12 5C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 1z"/></symbol>
  <symbol id="icon-team" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3"/><path d="M3 20v-1a6 6 0 0 1 12 0v1z"/><path d="M16 5.3a3 3 0 0 1 0 5.4M18 14a5 5 0 0 1 3 4.6V20h-3"/>
  </symbol>
  <symbol id="icon-events" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h2"/>
  </symbol>
  <symbol id="icon-stats" viewBox="0 0 24 24">
    <path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 6-7"/><path d="M17 6h4v4"/>
  </symbol>
  <symbol id="icon-links" viewBox="0 0 24 24">
    <path d="M10 13a5 5 0 0 0 7.1 0l3-3A5 5 0 0 0 13 2.9l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.1 0l-3 3A5 5 0 0 0 11 21.1l1.7-1.7"/>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M3 6h4m4 0h10M3 12h10m4 0h4M3 18h4m4 0h10"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></symbol>
  <symbol id="icon-battlepass" viewBox="0 0 24 24">
    <path d="m12 2 2.9 6 6.6 1-4.8 4.7 1.1 6.6-5.8-3.1-5.8 3.1 1.1-6.6L2.5 9l6.6-1z"/>
  </symbol>
  <symbol id="icon-rewards" viewBox="0 0 24 24">
    <path d="M3 10h18v11H3zM2 6h20v4H2zM12 6v15"/><path d="M12 6H8.5a2.5 2.5 0 1 1 2.2-3.7L12 6zm0 0h3.5a2.5 2.5 0 1 0-2.2-3.7L12 6z"/>
  </symbol>
  <symbol id="icon-reports" viewBox="0 0 24 24">
    <path d="M5 21V4"/><path d="M5 4c4-3 9 3 14 0v11c-5 3-10-3-14 0"/>
  </symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24">
    <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24">
    <path d="m18 6-12 12M6 6l12 12"/>
  </symbol>
  <symbol id="icon-left" viewBox="0 0 24 24">
    <path d="m15 18-6-6 6-6"/>
  </symbol>
  <symbol id="icon-right" viewBox="0 0 24 24">
    <path d="m9 18 6-6-6-6"/>
  </symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>
</svg>

  <main class="menu" aria-label="Меню сервера MRE">
    <header class="header">
      <div class="brand">
        <img src="../../../assets/mre-server-logo-transparent.png" width="72" height="72" alt="Логотип MRE">
        <div class="wordmark">MRE<span>Меню сервера</span></div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="notifications-toggle" type="button" aria-label="Уведомления" aria-expanded="false" aria-controls="notifications" title="Уведомления">
          <svg class="icon" aria-hidden="true"><use href="#icon-bell"></use></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="icon-button close-button" id="close-menu" type="button" aria-label="Закрыть меню" title="Закрыть меню">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </div>
    </header>
    <nav class="navigation" aria-label="Разделы меню">
      <div class="tabs" role="tablist" aria-label="Разделы сервера"></div>
    </nav>
    <div class="pages"></div>
    <footer class="footer">
      <div class="page-controls">
        <button class="icon-button small" id="previous-tab" type="button" aria-label="Предыдущая вкладка" title="Предыдущая вкладка">
          <svg class="icon" aria-hidden="true"><use href="#icon-left"></use></svg>
        </button>
        <button class="icon-button small" id="next-tab" type="button" aria-label="Следующая вкладка" title="Следующая вкладка">
          <svg class="icon" aria-hidden="true"><use href="#icon-right"></use></svg>
        </button>
        <span>Переключить вкладку</span>
      </div>
      <span class="footer-brand" aria-hidden="true">MRE</span>
    </footer>
    <section class="notifications" id="notifications" aria-label="Уведомления" hidden>
      <div class="notifications-header">
        <h2>Уведомления</h2>
        <button class="icon-button small" id="close-notifications" type="button" aria-label="Закрыть уведомления">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </div>
      <div class="notifications-empty">
        <svg class="icon" aria-hidden="true"><use href="#icon-bell"></use></svg>
        <p>Новых уведомлений нет</p>
      </div>
    </section>
  </main>
  <button id="reopen-menu" class="reopen" type="button" hidden>Открыть меню MRE</button>
</body>
</html>
